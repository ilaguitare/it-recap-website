<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-RECAP 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cairo:wght@300;400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a4d6d; --primary-light: #2a6d8f; --accent: #d4af37; --accent-light: #f0d98c;
            --dark: #0f1419; --text: #2c3e50; --text-light: #546e7a; --bg: #fafbfc; --white: #ffffff;
            --shadow: rgba(26, 77, 109, 0.1); --shadow-strong: rgba(26, 77, 109, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Padding top offset to account for the sticky navbar */
        body { font-family: 'Work Sans', 'Cairo', sans-serif; line-height: 1.6; color: var(--text); background: var(--bg); overflow-x: hidden; transition: all 0.3s ease; padding-top: 80px; }
        body[dir="rtl"] { font-family: 'Cairo', 'Work Sans', sans-serif; }

        /* --- NAVBAR & BURGER MENU --- */
        .navbar { position: fixed; top: 0; left: 0; right: 0; height: 80px; background: var(--white); box-shadow: 0 2px 15px var(--shadow); z-index: 2000; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        .nav-brand { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--primary); text-decoration: none; }
        
        .nav-wrapper { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: color 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        
        .burger { display: none; cursor: pointer; flex-direction: column; gap: 6px; background: none; border: none; padding: 10px; }
        .burger span { width: 30px; height: 3px; background-color: var(--primary); transition: 0.3s; border-radius: 5px; }

        .lang-toggle { background: var(--bg); border-radius: 50px; padding: 5px; display: flex; gap: 5px; direction: ltr !important; }
        .lang-btn { padding: 8px 15px; border: none; background: transparent; color: var(--text); font-weight: 600; cursor: pointer; border-radius: 50px; transition: all 0.3s ease; font-family: inherit; font-size: 0.9rem; }
        .lang-btn.active { background: var(--primary); color: var(--white); }

        @media (max-width: 992px) {
            .burger { display: flex; }
            .nav-links { display: none; flex-direction: column; position: absolute; top: 80px; left: 0; width: 100%; background: var(--white); padding: 20px 0; text-align: center; box-shadow: 0 10px 15px var(--shadow); }
            .nav-links.active { display: flex; }
            .nav-links li { padding: 10px 0; }
        }

        /* Header */
        header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: var(--white); padding: 100px 20px 80px; text-align: center; position: relative; overflow: hidden; }
        header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: url('images/header-bg.jpg'); background-size: cover; background-position: center; opacity: 0.3; z-index: 0; }
        header::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 20, 25, 0.5); z-index: 0; }
        .header-content { max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
        .workshop-label { display: inline-block; padding: 8px 24px; background: rgba(212, 175, 55, 0.2); border: 1px solid var(--accent-light); border-radius: 50px; font-size: 0.9rem; font-weight: 500; margin-bottom: 20px; letter-spacing: 1px; animation: fadeInDown 0.8s ease; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; margin-bottom: 20px; line-height: 1.2; animation: fadeInUp 0.8s ease 0.2s backwards; }
        .subtitle { font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 300; margin-bottom: 30px; opacity: 0.95; animation: fadeInUp 0.8s ease 0.4s backwards; }
        .event-info { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-top: 40px; animation: fadeInUp 0.8s ease 0.6s backwards; }
        .info-item { display: flex; align-items: center; gap: 10px; }
        .info-icon { font-size: 1.5rem; }

        /* Global Sections */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        section { padding: 80px 20px; }
        section:nth-child(even) { background: var(--white); }
        .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 2.8rem); color: var(--primary); margin-bottom: 20px; text-align: center; position: relative; padding-bottom: 20px; }
        .section-title::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80px; height: 3px; background: var(--accent); }
        .section-intro { text-align: center; max-width: 800px; margin: 0 auto 60px; font-size: 1.1rem; color: var(--text-light); line-height: 1.8; }

        /* Grids & Cards */
        .topics-grid, .organizers-grid, .attendees-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-top: 40px; }
        .organizers-grid { gap: 40px; }
        .topic-card, .organizer-card, .attendee-card { background: var(--white); padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 20px var(--shadow); transition: all 0.3s ease; }
        .topic-card { border-top: 4px solid var(--accent); }
        .attendee-card { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 4px solid var(--accent-light); }
        .attendee-icon { font-size: 3rem; margin-bottom: 15px; }
        section:nth-child(even) .topic-card, section:nth-child(even) .organizer-card, section:nth-child(even) .attendee-card { background: var(--bg); }
        .topic-card:hover, .organizer-card:hover, .attendee-card:hover { transform: translateY(-8px); box-shadow: 0 12px 40px var(--shadow-strong); }
        
        .topic-number { display: inline-block; width: 50px; height: 50px; background: var(--primary); color: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        .topic-card h3, .attendee-card h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--primary); margin-bottom: 15px; }
        .topic-card ul { list-style: none; margin-top: 15px; }
        .topic-card li { padding: 8px 0; padding-left: 25px; position: relative; color: var(--text-light); }
        body[dir="rtl"] .topic-card li { padding-left: 0; padding-right: 25px; }
        .topic-card li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 600; }
        body[dir="rtl"] .topic-card li::before { content: '←'; left: auto; right: 0; }

        /* Timeline */
        .timeline { max-width: 800px; margin: 60px auto; position: relative; padding: 20px 0; }
        .timeline::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--accent); transform: translateX(-50%); }
        .timeline-item { display: flex; margin-bottom: 40px; position: relative; }
        .timeline-item:nth-child(odd) { flex-direction: row; }
        .timeline-item:nth-child(even) { flex-direction: row-reverse; }
        body[dir="rtl"] .timeline-item:nth-child(odd) { flex-direction: row-reverse; }
        body[dir="rtl"] .timeline-item:nth-child(even) { flex-direction: row; }
        .timeline-content { background: var(--white); padding: 25px 30px; border-radius: 12px; box-shadow: 0 4px 20px var(--shadow); width: calc(50% - 40px); position: relative; }
        .timeline-dot { position: absolute; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; background: var(--accent); border: 4px solid var(--white); border-radius: 50%; box-shadow: 0 0 0 4px var(--accent-light); z-index: 1; }
        .timeline-date { font-weight: 700; color: var(--primary); margin-bottom: 8px; font-size: 1.1rem; }
        .timeline-title { color: var(--text-light); }

        /* Chairs Specific */
        .chair-card { padding: 20px; text-align: center; }
        .chair-img-container { width: 120px; height: 120px; margin: 0 auto 15px; border-radius: 50%; overflow: hidden; border: 3px solid var(--primary); background-color: var(--white); display: flex; align-items: center; justify-content: center; }
        .chair-img { width: 100%; height: 100%; object-fit: cover; }
        .chair-name { font-weight: 600; color: var(--primary); margin-bottom: 5px; font-size: 0.95rem; }
        .chair-aff { font-size: 0.85rem; color: var(--text-light); }

        /* Map specific */
        .map-container { width: 100%; height: 450px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px var(--shadow); border: 4px solid var(--white); }

        /* Organizers Specific */
        .organizer-logo { width: 120px; height: 120px; background: var(--white); border: 2px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; overflow: hidden; padding: 10px; }
        .organizer-logo img { width: 100%; height: 100%; object-fit: contain; }
        .organizer-card h3 { font-size: 1.2rem; color: var(--primary); margin-bottom: 5px; }
        .organizer-card p { color: var(--text-light); font-size: 0.9rem; }

        /* Carousel */
        .carousel-container { max-width: 900px; margin: 0 auto; position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 10px 30px var(--shadow-strong); }
        .carousel-track { display: flex; transition: transform 0.5s ease-in-out; height: 500px; }
        .carousel-slide { min-width: 100%; height: 100%; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.8); color: var(--primary); border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; z-index: 10; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        .carousel-btn:hover { background: var(--accent); color: var(--white); }
        .carousel-container[dir="ltr"] .carousel-btn.prev { left: 20px; right: auto; }
        .carousel-container[dir="ltr"] .carousel-btn.next { right: 20px; left: auto; }

        /* CTA Section */
        .cta-section { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%) !important; color: var(--white) !important; padding: 80px 20px; text-align: center; position: relative; overflow: hidden; }
        .cta-section h2 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 20px; color: var(--white); }
        .cta-section p { font-size: 1.2rem; margin-bottom: 40px; opacity: 0.95; color: var(--white); }
        .cta-buttons-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .btn { display: inline-block; padding: 18px 45px; background: var(--accent); color: var(--dark); text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 1.1rem; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3); border: 2px solid var(--accent); }
        .btn:hover { background: var(--accent-light); transform: translateY(-3px); box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4); }
        .btn-secondary { background: transparent; color: var(--white); border: 2px solid var(--white); }
        .btn-secondary:hover { background: var(--white); color: var(--primary); }

        /* Footer */
        footer { background: var(--dark); color: rgba(255, 255, 255, 0.8); padding: 60px 20px 30px; text-align: center; }
        .footer-content { max-width: 1200px; margin: 0 auto; }
        .footer-logo { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--accent); margin-bottom: 20px; }
        .footer-links { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin: 30px 0; }
        .footer-links a { color: rgba(255, 255, 255, 0.8); text-decoration: none; transition: color 0.3s ease; }
        .footer-links a:hover { color: var(--accent); }
        .footer-contact { margin: 20px 0; font-size: 1rem; color: var(--accent-light); }
        .copyright { margin-top: 20px; padding-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.9rem; }

        @media (max-width: 768px) {
            .event-info { gap: 20px; }
            .timeline::before { left: 30px; }
            .timeline-item { flex-direction: row !important; }
            .timeline-content { width: calc(100% - 80px); margin-left: 50px; }
            body[dir="rtl"] .timeline-content { margin-left: 0; margin-right: 50px; }
            .timeline-dot { left: 30px; transform: translateX(0); }
            body[dir="rtl"] .timeline-dot { left: auto; right: 30px; }
            .carousel-track { height: 300px; } .carousel-btn { width: 40px; height: 40px; font-size: 1.2rem; }
        }
    </style>
</head>

    <script src="content.js"></script>

    <script>
        // Toggle Mobile Menu
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        // Close menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof content === 'undefined') {
                alert("Erreur : Le fichier content.js est manquant ou contient une erreur !");
                return;
            }
            setLanguage(content.settings.defaultLang);
            loadStaticImages();
        });

        function setLanguage(lang) {
            const body = document.body;
            const buttons = document.querySelectorAll('.lang-btn');

            if (lang === 'ar') {
                document.documentElement.setAttribute('lang', 'ar');
                body.setAttribute('dir', 'rtl');
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
            } else {
                document.documentElement.setAttribute('lang', 'en');
                body.setAttribute('dir', 'ltr');
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            }

            populateText(lang);
            populateLists(lang);
            populateChairs(lang);
            populateOrganizers(lang);
            populateFooter(lang);
        }

        // Encodeur d'Email 100% sécurisé pour contourner les bugs de messagerie
        function generateMailto(subject, bodyText) {
            return "mailto:" + content.settings.email + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(bodyText);
        }

        function populateText(lang) {
            // Navbar
            document.getElementById('nav-about').textContent = content.nav.about[lang];
            document.getElementById('nav-topics').textContent = content.nav.topics[lang];
            document.getElementById('nav-dates').textContent = content.nav.dates[lang];
            document.getElementById('nav-venue').textContent = content.nav.venue[lang];
            document.getElementById('nav-committees').textContent = content.nav.committees[lang];
            document.getElementById('nav-sponsors').textContent = content.nav.sponsors[lang];
            document.getElementById('nav-submission').textContent = content.nav.submission[lang];

            document.getElementById('header-label').innerHTML = content.header.label[lang];
            document.getElementById('header-title').textContent = content.header.title;
            document.getElementById('header-subtitle').innerHTML = content.header.subtitle[lang];
            document.getElementById('header-date').innerHTML = `<strong>${content.header.date[lang]}</strong>`;
            document.getElementById('header-location').innerHTML = `<strong>${content.header.location[lang]}</strong>`;

            document.getElementById('about-title').textContent = content.about.title[lang];
            document.getElementById('about-text1').textContent = content.about.text1[lang];
            document.getElementById('about-text2').textContent = content.about.text2[lang];

            document.getElementById('attendees-title').textContent = content.attendeesSection.title[lang];

            document.getElementById('topics-title').textContent = content.topicsSection.title[lang];
            document.getElementById('dates-title').textContent = content.datesSection.title[lang];
            
            document.getElementById('venue-title').textContent = content.venueSection.title[lang];
            document.getElementById('venue-text').textContent = content.venueSection.text[lang];

            document.getElementById('chairs-title').textContent = content.chairsSection.title[lang];
            document.getElementById('general-chairs-title').textContent = content.chairsSection.generalTitle[lang];
            document.getElementById('tpc-chairs-title').textContent = content.chairsSection.tpcTitle[lang];
            document.getElementById('admin-chairs-title').textContent = content.chairsSection.adminTitle[lang];

            document.getElementById('sponsors-title').textContent = content.sponsorsSection.title[lang];
            document.getElementById('sponsors-text').textContent = content.sponsorsSection.text[lang];
            
            const btnSponsor = document.getElementById('btn-sponsor');
            btnSponsor.textContent = content.sponsorsSection.btn[lang];
            btnSponsor.href = generateMailto(content.emailTemplates.sponsor.subject[lang], content.emailTemplates.sponsor.body[lang]);

            document.getElementById('organizers-title').textContent = content.organizersSection.title[lang];
            
            document.getElementById('submission-title').textContent = content.submissionSection.title[lang];
            document.getElementById('submission-intro').textContent = content.submissionSection.intro[lang];
            document.getElementById('submission-req-title').textContent = content.submissionSection.requirementsTitle[lang];

            document.getElementById('cultural-text').textContent = content.culturalSection.text[lang];
            document.getElementById('cultural-title').textContent = content.culturalSection.title[lang];

            document.getElementById('cta-title').textContent = content.buttons.ready[lang];
            document.getElementById('cta-subtitle').textContent = content.buttons.join[lang];

            // --- GESTION DES BOUTONS D'EMAIL SÉCURISÉE ---
                        const btnSubmit = document.getElementById('btn-submit');
                        if (btnSubmit) {
                            btnSubmit.textContent = content.buttons.submit[lang];
                            if (content.emailTemplates) {
                                btnSubmit.href = generateMailto(content.emailTemplates.submit.subject[lang], content.emailTemplates.submit.body[lang]);
                            } else if (content.buttonsLinks) {
                                btnSubmit.href = content.buttonsLinks.submit[lang];
                            }
                        }

                        const btnContact = document.getElementById('btn-contact');
                        if (btnContact) {
                            btnContact.textContent = content.buttons.contact[lang];
                            if (content.emailTemplates) {
                                btnContact.href = generateMailto(content.emailTemplates.contact.subject[lang], content.emailTemplates.contact.body[lang]);
                            } else if (content.buttonsLinks) {
                                btnContact.href = content.buttonsLinks.contact[lang];
                            }
                        }
                        
                        const btnSponsor = document.getElementById('btn-sponsor');
                        if (btnSponsor && content.sponsorsSection) {
                            btnSponsor.textContent = content.sponsorsSection.btn[lang];
                            if (content.emailTemplates) {
                                btnSponsor.href = generateMailto(content.emailTemplates.sponsor.subject[lang], content.emailTemplates.sponsor.body[lang]);
                            }
                        }

            document.getElementById('footer-logo').textContent = content.header.title;
            document.getElementById('footer-contact').innerHTML = `&#9993; <a href="mailto:${content.settings.email}" style="color:var(--accent-light); text-decoration:none;">${content.settings.email}</a> &nbsp; | &nbsp; &#9742; <span dir="ltr">${content.settings.phone}</span>`;
            document.getElementById('copyright').textContent = content.footer.rights[lang];
        }

        function populateLists(lang) {
            // Attendees Grid
            const attGrid = document.getElementById('attendees-grid');
            attGrid.innerHTML = content.attendeesSection.list.map(att => `
                <div class="attendee-card">
                    <div class="attendee-icon">${att.icon}</div>
                    <h3>${att.title[lang]}</h3>
                </div>
            `).join('');

            // Topics Grid
            const topicsContainer = document.getElementById('topics-grid');
            topicsContainer.innerHTML = '';
            content.topicsSection.list.forEach((topic, index) => {
                let ulHtml = '';
                topic.items[lang].forEach(item => {
                    ulHtml += `<li>${item}</li>`;
                });
                topicsContainer.innerHTML += `
                    <div class="topic-card">
                        <div class="topic-number">${index + 1}</div>
                        <h3>${topic.title[lang]}</h3>
                        <ul>${ulHtml}</ul>
                    </div>
                `;
            });

            // Dates
            const timelineContainer = document.getElementById('dates-timeline');
            timelineContainer.innerHTML = '';
            content.datesSection.timeline.forEach(item => {
                timelineContainer.innerHTML += `
                    <div class="timeline-item">
                        <div class="timeline-content">
                            <div class="timeline-date">${item.date[lang]}</div>
                            <div class="timeline-title">${item.event[lang]}</div>
                        </div>
                        <div class="timeline-dot"></div>
                    </div>
                `;
            });

            // Submissions
            const subList = document.getElementById('submission-list');
            subList.innerHTML = '';
            const paddingSide = lang === 'ar' ? 'padding-right' : 'padding-left';
            const arrowPos = lang === 'ar' ? 'right' : 'left';
            const arrowChar = lang === 'ar' ? '←' : '→';

            content.submissionSection.requirements[lang].forEach(req => {
                subList.innerHTML += `
                    <li style="padding: 10px 0; ${paddingSide}: 25px; position: relative;">
                        <span style="position: absolute; ${arrowPos}: 0; color: var(--accent); font-weight: 600;">${arrowChar}</span>
                        ${req}
                    </li>
                `;
            });
        }

        function populateChairs(lang) {
                    const createChairHTML = (chair) => {
                        let imgSrc = chair.img;
                        
                        if (!imgSrc) {
                            let cleanName = chair.name.en.replace(/^(Dr\.|Mr\.|Ms\.|Prof\.)\s+/i, ''); 
                            cleanName = cleanName.toLowerCase().replace(/[\s_]+/g, '-').replace(/[^a-z0-9\-]/g, ''); 
                            imgSrc = `images/chairs/${cleanName}.jpg`;
                        }

                        return `
                            <div class="chair-card">
                                <div class="chair-img-container">
                                    <img src="${imgSrc}" alt="${chair.name[lang]}" class="chair-img" onerror="this.onerror=null; this.src='images/chairs/unknown.jpg';">
                                </div>
                                <p class="chair-name">${chair.name[lang]}</p>
                                <p class="chair-aff">${chair.aff[lang]}</p>
                            </div>
                        `;
                    };

                    // Remplissage General Chairs
                    document.getElementById('general-chairs-grid').innerHTML = content.chairsSection.generalChairs.map(createChairHTML).join('');
                    
                    // Remplissage TPC divisé en 4 Tracks
                    const tpcContainer = document.getElementById('tpc-tracks-container');
                    tpcContainer.innerHTML = '';
                    if(content.chairsSection.tpcTracks) {
                        content.chairsSection.tpcTracks.forEach(track => {
                            tpcContainer.innerHTML += `
                                <div style="margin-bottom: 40px; padding: 25px; background: rgba(26, 77, 109, 0.02); border-radius: 12px; border-top: 3px solid var(--primary-light);">
                                    <h4 style="font-family: 'Cairo', 'Work Sans', sans-serif; font-size: 1.2rem; color: var(--primary); text-align: center; margin-bottom: 25px;">${track.trackName[lang]}</h4>
                                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; text-align: center;">
                                        ${track.chairs.map(createChairHTML).join('')}
                                    </div>
                                </div>
                            `;
                        });
                    }

                    // Remplissage Admin
                    document.getElementById('admin-chairs-grid').innerHTML = content.chairsSection.adminCommittee.map(createChairHTML).join('');
                }
        function populateOrganizers(lang) {
            const orgGrid = document.getElementById('organizers-grid');
            orgGrid.innerHTML = content.organizersSection.list.map(org => `
                <div class="organizer-card">
                    <div class="organizer-logo">
                        <img src="${org.logo}" alt="${org.name[lang]} Logo">
                    </div>
                    <h3>${org.name[lang]}</h3>
                    <p>${org.desc[lang]}</p>
                </div>
            `).join('');
        }

        function populateFooter(lang) {
            const linksContainer = document.getElementById('footer-links');
            const m = content.footer.menu;
            linksContainer.innerHTML = `
                <a href="#about">${m.about[lang]}</a>
                <a href="#topics">${m.topics[lang]}</a>
                <a href="#dates">${m.dates[lang]}</a>
                <a href="#chairs">${m.chairs[lang]}</a>
                <a href="#organizers">${m.organizers[lang]}</a>
                <a href="#submission">${m.submission[lang]}</a>
            `;
        }

        function loadStaticImages() {
            const track = document.getElementById('carouselTrack');
            track.innerHTML = content.culturalSection.images.map(img => `
                <div class="carousel-slide"><img src="${img}" alt="Cultural Image"></div>
            `).join('');
        }

        // --- Logique Carrousel ---
        let currentIndex = 0;
        function moveSlide(direction) {
            const slides = document.querySelectorAll('.carousel-slide');
            const totalSlides = slides.length;
            if (totalSlides === 0) return;

            currentIndex += direction;
            if (currentIndex < 0) currentIndex = totalSlides - 1;
            else if (currentIndex >= totalSlides) currentIndex = 0;

            const offset = -currentIndex * 100;
            document.getElementById('carouselTrack').style.transform = `translateX(${offset}%)`;
        }
        setInterval(() => moveSlide(1), 4000);

        // --- Animations & Smooth Scroll ---
                // On cible uniquement les vrais liens de navigation (menu haut et footer), pas les boutons d'email
                document.querySelectorAll('.nav-links a, .footer-links a').forEach(anchor => {
                    anchor.addEventListener('click', function (e) {
                        const href = this.getAttribute('href');
                        if (href && href.startsWith('#')) {
                            e.preventDefault();
                            const target = document.querySelector(href);
                            if (target) {
                                const topPos = target.getBoundingClientRect().top + window.pageYOffset - 80; // 80 = hauteur du menu
                                window.scrollTo({ top: topPos, behavior: 'smooth' });
                            }
                        }
                    });
                });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1 });

        setTimeout(() => {
            document.querySelectorAll('.topic-card, .timeline-item, .organizer-card, .chair-card, .attendee-card').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(30px)';
                el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(el);
            });
        }, 500);
    </script>
</body>
