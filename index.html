<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-RECAP 2026</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cairo:wght@300;400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #1a4d6d;
            --primary-light: #2a6d8f;
            --accent: #d4af37;
            --accent-light: #f0d98c;
            --dark: #0f1419;
            --text: #2c3e50;
            --text-light: #546e7a;
            --bg: #fafbfc;
            --white: #ffffff;
            --shadow: rgba(26, 77, 109, 0.1);
            --shadow-strong: rgba(26, 77, 109, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Work Sans', 'Cairo', sans-serif; line-height: 1.6; color: var(--text); background: var(--bg); overflow-x: hidden; transition: all 0.3s ease; }
        body[dir="rtl"] { font-family: 'Cairo', 'Work Sans', sans-serif; }

        /* Language Toggle */
        .lang-toggle { position: fixed; top: 20px; right: 20px; z-index: 1000; background: var(--white); border-radius: 50px; box-shadow: 0 4px 20px var(--shadow); padding: 8px; display: flex; gap: 5px; direction: ltr !important; }
        .lang-btn { padding: 10px 20px; border: none; background: transparent; color: var(--text); font-weight: 500; cursor: pointer; border-radius: 50px; transition: all 0.3s ease; font-family: inherit; }
        .lang-btn.active { background: var(--primary); color: var(--white); }
        .lang-btn:hover:not(.active) { background: var(--bg); }

        /* Header */
        header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: var(--white); padding: 120px 20px 80px; text-align: center; position: relative; overflow: hidden; }
        header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: url('images/header-bg.jpg'); background-size: cover; background-position: center; opacity: 0.3; z-index: 0; }
        header::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 20, 25, 0.5); z-index: 0; }
        .header-content { max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
        .workshop-label { display: inline-block; padding: 8px 24px; background: rgba(212, 175, 55, 0.2); border: 1px solid var(--accent-light); border-radius: 50px; font-size: 0.9rem; font-weight: 500; margin-bottom: 20px; letter-spacing: 1px; animation: fadeInDown 0.8s ease; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; margin-bottom: 20px; line-height: 1.2; animation: fadeInUp 0.8s ease 0.2s backwards; }
        .subtitle { font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 300; margin-bottom: 30px; opacity: 0.95; animation: fadeInUp 0.8s ease 0.4s backwards; }
        .event-info { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-top: 40px; animation: fadeInUp 0.8s ease 0.6s backwards; }
        .info-item { display: flex; align-items: center; gap: 10px; }
        .info-icon { font-size: 1.5rem; }

        /* Global Sections */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        section { padding: 80px 20px; }
        section:nth-child(even) { background: var(--white); }
        .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 2.8rem); color: var(--primary); margin-bottom: 20px; text-align: center; position: relative; padding-bottom: 20px; }
        .section-title::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80px; height: 3px; background: var(--accent); }
        .section-intro { text-align: center; max-width: 800px; margin: 0 auto 60px; font-size: 1.1rem; color: var(--text-light); line-height: 1.8; }

        /* Grids & Cards */
        .topics-grid, .organizers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-top: 60px; }
        .organizers-grid { gap: 40px; }
        .topic-card, .organizer-card { background: var(--white); padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 20px var(--shadow); transition: all 0.3s ease; }
        .topic-card { border-top: 4px solid var(--accent); }
        section:nth-child(even) .topic-card, section:nth-child(even) .organizer-card { background: var(--bg); }
        .topic-card:hover, .organizer-card:hover { transform: translateY(-8px); box-shadow: 0 12px 40px var(--shadow-strong); }
        .topic-number { display: inline-block; width: 50px; height: 50px; background: var(--primary); color: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        .topic-card h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--primary); margin-bottom: 15px; }
        .topic-card ul { list-style: none; margin-top: 15px; }
        .topic-card li { padding: 8px 0; padding-left: 25px; position: relative; color: var(--text-light); }
        body[dir="rtl"] .topic-card li { padding-left: 0; padding-right: 25px; }
        .topic-card li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 600; }
        body[dir="rtl"] .topic-card li::before { content: '←'; left: auto; right: 0; }

        /* Timeline */
        .timeline { max-width: 800px; margin: 60px auto; position: relative; padding: 20px 0; }
        .timeline::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--accent); transform: translateX(-50%); }
        .timeline-item { display: flex; margin-bottom: 40px; position: relative; }
        .timeline-item:nth-child(odd) { flex-direction: row; }
        .timeline-item:nth-child(even) { flex-direction: row-reverse; }
        body[dir="rtl"] .timeline-item:nth-child(odd) { flex-direction: row-reverse; }
        body[dir="rtl"] .timeline-item:nth-child(even) { flex-direction: row; }
        .timeline-content { background: var(--white); padding: 25px 30px; border-radius: 12px; box-shadow: 0 4px 20px var(--shadow); width: calc(50% - 40px); position: relative; }
        .timeline-dot { position: absolute; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; background: var(--accent); border: 4px solid var(--white); border-radius: 50%; box-shadow: 0 0 0 4px var(--accent-light); z-index: 1; }
        .timeline-date { font-weight: 700; color: var(--primary); margin-bottom: 8px; font-size: 1.1rem; }
        .timeline-title { color: var(--text-light); }

        /* Chairs Specific */
        .chair-card { padding: 20px; text-align: center; }
        .chair-img-container { 
            width: 120px; 
            height: 120px; 
            margin: 0 auto 15px; 
            border-radius: 50%; 
            overflow: hidden; 
            border: 3px solid var(--primary); 
            background-color: var(--white); 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chair-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }
        .chair-name { font-weight: 600; color: var(--primary); margin-bottom: 5px; font-size: 0.95rem; }
        .chair-aff { font-size: 0.85rem; color: var(--text-light); }

        /* Organizers Specific */
        .organizer-logo { width: 120px; height: 120px; background: var(--white); border: 2px solid var(--primary); border-radius: 50%; display: flex; align-items: center;
